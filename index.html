<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kansei Radio — Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@100;200;300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B0D12; --red:#E3121B; --paper:#ECECEC;
    --g1:#8C8C8C; --g2:#7D7D7D; --line:rgba(236,236,236,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--ink);color:var(--paper);font-family:Saira,system-ui,sans-serif;overflow:hidden}
  canvas#viz{position:fixed;inset:0;width:100%;height:100%;display:block}
  .grain{position:fixed;inset:0;pointer-events:none;opacity:.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
  .ui{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;padding:clamp(18px,3vw,40px);pointer-events:none}
  .ui > *{pointer-events:auto}

  header{display:flex;align-items:center;justify-content:space-between;gap:20px}
  header .logo svg{height:clamp(22px,2.4vw,30px);width:auto;display:block}
  .status{display:flex;align-items:center;gap:18px;font-weight:300;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--g1)}
  .onair{display:flex;align-items:center;gap:9px}
  .onair i{width:8px;height:8px;border-radius:50%;background:var(--g2);display:block;transition:background .3s}
  .playing .onair i{background:var(--red);box-shadow:0 0 12px var(--red);animation:blink 2.4s ease-in-out infinite}
  .playing .onair{color:var(--paper)}
  @keyframes blink{50%{opacity:.35}}

  .hero{align-self:center;max-width:min(560px,46vw)}
  .kicker{font-weight:300;font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--g1);display:flex;align-items:center;gap:12px}
  .kicker:before{content:"";width:22px;height:1px;background:var(--red)}
  h1{font-weight:100;font-size:clamp(64px,10vw,168px);line-height:.86;letter-spacing:.04em;margin:18px 0 22px;text-transform:uppercase}
  .tag{font-weight:300;font-size:clamp(14px,1.2vw,17px);line-height:1.6;color:var(--g1);max-width:420px}

  .bar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:clamp(16px,2.4vw,32px);
       border-top:1px solid var(--line);padding-top:clamp(16px,2vw,24px)}
  .play{width:64px;height:64px;border-radius:50%;border:1px solid rgba(236,236,236,.4);background:transparent;color:var(--paper);
        cursor:pointer;display:grid;place-items:center;transition:border-color .2s,background .2s,transform .15s}
  .play:hover{border-color:var(--red)}
  .play:active{transform:scale(.96)}
  .play:focus-visible{outline:2px solid var(--red);outline-offset:4px}
  .play svg{width:20px;height:20px}
  .play .i-pause{display:none}
  .playing .play{background:var(--red);border-color:var(--red)}
  .playing .play .i-play{display:none}
  .playing .play .i-pause{display:block}

  .np{min-width:0}
  .np .lbl{font-weight:300;font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--g2)}
  .np .next{color:var(--g2);margin-left:14px;letter-spacing:.18em}
  .np .next:not(:empty):before{content:"— ";color:var(--red)}
  .np .title{font-weight:500;font-size:clamp(16px,1.6vw,21px);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .np .artist{font-weight:300;font-size:14px;color:var(--g1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .right{display:flex;align-items:center;gap:22px}
  .mode{font-weight:300;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--g2);border:1px solid var(--line);padding:6px 10px;border-radius:2px;white-space:nowrap}
  .vol{display:flex;align-items:center;gap:10px;color:var(--g1)}
  .vol svg{width:18px;height:18px}
  input[type=range]{-webkit-appearance:none;appearance:none;width:110px;height:2px;background:rgba(236,236,236,.25);outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--paper);border:0}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--paper);border:0}
  input[type=range]:focus-visible::-webkit-slider-thumb{background:var(--red)}

  .err{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);font-size:13px;font-weight:300;color:var(--paper);
       background:rgba(11,13,18,.9);border:1px solid var(--red);padding:10px 16px;display:none}

  @media (max-width:760px){
    .hero{max-width:100%;align-self:start;margin-top:8vh}
    .status .clock{display:none}
    .bar{grid-template-columns:auto 1fr}
    .right{grid-column:1/-1;justify-content:space-between}
    input[type=range]{width:140px}
  }
</style>
</head>

<script>
/* =========================================================
   KANSEI RADIO — player
   Modalità, in ordine di priorità:
   1. STREAM  — se STREAM_URL è impostato (es. AzuraCast in futuro)
   2. SYNC    — radio sincronizzata: legge playlist.json e calcola dall'ora
                quale brano suona e da che punto. Tutti sentono la stessa cosa.
   3. GENERATIVA — fallback nel browser se i primi due non sono disponibili.
   ========================================================= */
const STREAM_URL = "";                 // lasciare vuoto per la radio sincronizzata
const NOWPLAYING_URL = "";             // API now playing AzuraCast (solo modalità STREAM)
const STREAM_CORS = true;              // vedi README
const PLAYLIST_URL = "playlist.json";
const STREAM_TIMEOUT = 6000;

const $ = id => document.getElementById(id);
const app = $("app");
let ctx, master, analyser, playing = false, engine = null;
let mode = null; // "stream" | "sync" | "gen"

/* ---------- orologio ---------- */
function tick(){ const d=new Date(); $("clock").textContent=d.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"})+" · Bitritto"; }
tick(); setInterval(tick, 10000);

/* ---------- audio graph ---------- */
function initAudio(){
  if (ctx) return;
  ctx = new (window.AudioContext||window.webkitAudioContext)();
  master = ctx.createGain(); master.gain.value = +$("vol").value;
  analyser = ctx.createAnalyser(); analyser.fftSize = 2048; analyser.smoothingTimeConstant = .82;
  master.connect(analyser); analyser.connect(ctx.destination);
}

/* ---------- motore generativo (demo, nessun file esterno) ---------- */
function makeEngine(){
  const out = ctx.createGain(); out.gain.value = .9; out.connect(master);
  // riverbero: risposta all'impulso sintetica
  const conv = ctx.createConvolver();
  const len = ctx.sampleRate*4.5, ir = ctx.createBuffer(2,len,ctx.sampleRate);
  for (let c=0;c<2;c++){ const d=ir.getChannelData(c); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6); }
  conv.buffer = ir;
  const revGain = ctx.createGain(); revGain.gain.value = .55; conv.connect(revGain); revGain.connect(out);
  // delay ping
  const dly = ctx.createDelay(2), fb = ctx.createGain(), dlf = ctx.createBiquadFilter();
  dlf.type="lowpass"; dlf.frequency.value=2600; fb.gain.value=.42;
  dly.connect(dlf); dlf.connect(fb); fb.connect(dly); dlf.connect(out); dlf.connect(conv);

  const scales = [
    {name:"Re dorico",  root:50, steps:[0,2,3,5,7,9,10], prog:[[0,3,7,10,14],[ -2,2,5,9,14],[3,7,10,14,17],[-4,0,3,7,10]]},
    {name:"La eolio",   root:45, steps:[0,2,3,5,7,8,10], prog:[[0,3,7,10,14],[-4,0,3,7,11],[-7,-3,0,4,7],[-2,2,5,9,12]]},
    {name:"Fa lidio",   root:41, steps:[0,2,4,6,7,9,11], prog:[[0,4,7,11,14],[2,6,9,14,16],[-3,0,4,7,11],[7,11,14,18,21]]},
    {name:"Mi frigio",  root:40, steps:[0,1,3,5,7,8,10], prog:[[0,3,7,10,15],[1,5,8,12,15],[-4,0,3,7,12],[-2,1,5,8,13]]},
  ];
  const titles = ["Superfici","Porta sul futuro","Luce lenta","Sala 3","Atelier","Riflesso","Soglia","Campo aperto","Notturno","Materia","Segnale","Ritorno"];
  const mtof = m => 440*Math.pow(2,(m-69)/12);

  let sc, bpm, step=0, bar=0, nextT=0, timer=null, trackStart=0, trackLen=0, chordIdx=0, padVoices=[];
  function newTrack(){
    sc = scales[Math.floor(Math.random()*scales.length)];
    bpm = 66 + Math.floor(Math.random()*24);
    dly.delayTime.value = 60/bpm*0.75;
    trackStart = ctx.currentTime; trackLen = 150 + Math.random()*90; bar=0; chordIdx=0;
    const t = titles[Math.floor(Math.random()*titles.length)];
    setNowPlaying(t, `Generativo · ${sc.name} · ${bpm} BPM`);
  }
  function env(g,t,a,s,r,peak){ g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(peak,t+a); g.gain.setValueAtTime(peak,t+a+s); g.gain.exponentialRampToValueAtTime(0.0001,t+a+s+r); }

  function pad(t, chord, dur){
    padVoices.forEach(v=>{ try{v.g.gain.cancelScheduledValues(t); v.g.gain.setTargetAtTime(0.0001,t,1.2); v.o.forEach(o=>o.stop(t+6));}catch(e){} });
    padVoices = [];
    chord.forEach((iv,k)=>{
      const f = mtof(sc.root+12+iv);
      const g = ctx.createGain(), lp = ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=700+k*120; lp.Q.value=.6;
      const lfo = ctx.createOscillator(), lg = ctx.createGain(); lfo.frequency.value=.05+Math.random()*.08; lg.gain.value=380; lfo.connect(lg); lg.connect(lp.frequency);
      const os = [-7,7].map(dt=>{ const o=ctx.createOscillator(); o.type="sawtooth"; o.frequency.value=f; o.detune.value=dt; o.connect(lp); o.start(t); return o; });
      lfo.start(t); os.push(lfo);
      lp.connect(g); g.connect(out); g.connect(conv);
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(.022,t+3.5);
      padVoices.push({g,o:os});
    });
  }
  function pluck(t,m,vel){
    const o=ctx.createOscillator(), g=ctx.createGain(), f=ctx.createBiquadFilter();
    o.type = Math.random()<.5?"triangle":"sine"; o.frequency.value=mtof(m);
    f.type="lowpass"; f.frequency.setValueAtTime(5000,t); f.frequency.exponentialRampToValueAtTime(600,t+.6);
    o.connect(f); f.connect(g); g.connect(out); g.connect(dly); g.connect(conv);
    env(g,t,.005,.02,1.1,.12*vel); o.start(t); o.stop(t+1.4);
  }
  function bass(t,m,dur){
    const o=ctx.createOscillator(), g=ctx.createGain(); o.type="sine"; o.frequency.value=mtof(m);
    o.connect(g); g.connect(out); env(g,t,.04,dur*.6,dur*.5,.22); o.start(t); o.stop(t+dur*1.2);
  }
  function kick(t,v){
    const o=ctx.createOscillator(), g=ctx.createGain(); o.frequency.setValueAtTime(110,t); o.frequency.exponentialRampToValueAtTime(42,t+.18);
    o.connect(g); g.connect(out); env(g,t,.002,.02,.38,.42*v); o.start(t); o.stop(t+.5);
  }
  let noiseBuf; { const n=ctx.sampleRate*.2; noiseBuf=ctx.createBuffer(1,n,ctx.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1; }
  function tickHat(t,v){
    const s=ctx.createBufferSource(), f=ctx.createBiquadFilter(), g=ctx.createGain(); s.buffer=noiseBuf;
    f.type="highpass"; f.frequency.value=7000; s.connect(f); f.connect(g); g.connect(out); g.connect(dly);
    env(g,t,.001,.005,.05,.05*v); s.start(t); s.stop(t+.1);
  }

  function schedule(){
    const spb = 60/bpm/4; // sedicesimi
    while (nextT < ctx.currentTime + .15){
      const s = step%16, chord = sc.prog[chordIdx%sc.prog.length];
      if (s===0){
        if (bar%4===0){ pad(nextT, chord, spb*64); }
        bass(nextT, sc.root-12+chord[0], spb*8);
        if (ctx.currentTime-trackStart > trackLen) { newTrack(); }
      }
      if (s===8) bass(nextT, sc.root-12+chord[0]+(Math.random()<.5?7:12), spb*6);
      const section = Math.floor(bar/8)%3; // 0 calmo, 1 pulsato, 2 pieno
      if (section>0 && (s===0 || s===8 || (section===2 && s===10 && Math.random()<.4))) kick(nextT, s===0?1:.7);
      if (section===2 && s%4===2) tickHat(nextT, .6+Math.random()*.4);
      if (s%2===0 && Math.random() < (section===0?.35:.55)){
        const pool = chord.concat(sc.steps.map(x=>x+12));
        const m = sc.root+12+pool[Math.floor(Math.random()*pool.length)] + (Math.random()<.3?12:0);
        pluck(nextT, m, .5+Math.random()*.5);
      }
      nextT += spb; step++;
      if (step%16===0){ bar++; if (bar%4===0) chordIdx++; }
    }
  }
  return {
    start(){ nextT = ctx.currentTime+.08; newTrack(); timer = setInterval(schedule, 25); out.gain.setTargetAtTime(.9, ctx.currentTime, .3); },
    stop(){ clearInterval(timer); out.gain.setTargetAtTime(0.0001, ctx.currentTime, .4);
      padVoices.forEach(v=>v.o.forEach(o=>{try{o.stop(ctx.currentTime+2)}catch(e){}})); padVoices=[];
      setTimeout(()=>{ try{out.disconnect()}catch(e){} }, 2500); }
  };
}

/* ---------- radio sincronizzata (playlist.json) ---------- */
let playlist = null, clockSkew = 0, decks = [], cur = 0, curIdx = -1, syncTimer = null;
async function loadPlaylist(){
  if (playlist) return playlist;
  const r = await fetch(PLAYLIST_URL, {cache:"no-cache"});
  if (!r.ok) throw new Error("playlist");
  const d = r.headers.get("Date"); if (d){ const sv = Date.parse(d); if (!isNaN(sv)) clockSkew = sv - Date.now(); }
  const p = await r.json();
  if (!p.tracks || !p.tracks.length) throw new Error("vuota");
  p.epochMs = Date.parse(p.epoch||"2026-01-01T00:00:00Z");
  p.total = p.tracks.reduce((a,t)=>a+t.duration,0);
  playlist = p; return p;
}
function nowSec(){ return (Date.now()+clockSkew - playlist.epochMs)/1000; }
function whereAreWe(){
  let pos = ((nowSec() % playlist.total) + playlist.total) % playlist.total;
  for (let i=0;i<playlist.tracks.length;i++){ const d=playlist.tracks[i].duration; if (pos<d) return {i, off:pos}; pos-=d; }
  return {i:0, off:0};
}
function makeDeck(){
  const el = new Audio(); el.preload = "auto";
  ctx.createMediaElementSource(el).connect(master);
  el.addEventListener("ended", ()=>{ if (mode==="sync" && playing && decks[cur]===el) advance(); });
  return el;
}
function showTrack(i){
  const t = playlist.tracks[i], n = playlist.tracks[(i+1)%playlist.tracks.length];
  setNowPlaying(t.title, `${t.artist}${t.info?" · "+t.info:""}`);
  $("npNext").textContent = "Dopo: " + n.title;
}
function playAt(i, off){
  const el = decks[cur]; curIdx = i;
  el.src = playlist.tracks[i].file;
  const go = ()=>{ try{ el.currentTime = off; }catch(e){} el.play().catch(()=>{}); };
  if (off > .5) el.addEventListener("loadedmetadata", go, {once:true}); else go();
  showTrack(i);
  // precarica il brano successivo sull'altro deck
  const nx = decks[1-cur]; nx.src = playlist.tracks[(i+1)%playlist.tracks.length].file; nx.load();
}
function advance(){
  const nextIdx = (curIdx+1) % playlist.tracks.length;
  cur = 1-cur; const el = decks[cur]; curIdx = nextIdx;
  el.currentTime = 0; el.play().catch(()=>{}); showTrack(nextIdx);
  const nx = decks[1-cur]; setTimeout(()=>{ nx.src = playlist.tracks[(nextIdx+1)%playlist.tracks.length].file; nx.load(); }, 1500);
}
function resync(){ // corregge eventuali derive (rete lenta, tab in background)
  if (mode!=="sync" || !playing) return;
  const w = whereAreWe(), el = decks[cur];
  if (w.i !== curIdx || Math.abs(el.currentTime - w.off) > 4) playAt(w.i, w.off);
}
async function startSync(){
  await loadPlaylist();
  if (!decks.length) decks = [makeDeck(), makeDeck()];
  const w = whereAreWe(); playAt(w.i, w.off);
  clearInterval(syncTimer); syncTimer = setInterval(resync, 20000);
}
function stopSync(){ clearInterval(syncTimer); decks.forEach(d=>{ d.pause(); }); }
document.addEventListener("visibilitychange", ()=>{ if (!document.hidden) resync(); });

/* ---------- stream (AzuraCast, opzionale) ---------- */
let audioEl = null, npTimer = null, fallbackTimer = null;
function startStream(){
  return new Promise((res, rej)=>{
    if (!audioEl){
      audioEl = new Audio(); audioEl.preload = "none";
      if (STREAM_CORS){ audioEl.crossOrigin = "anonymous"; ctx.createMediaElementSource(audioEl).connect(master); }
      else audioEl.volume = +$("vol").value;
    }
    audioEl.onerror = ()=>rej(new Error("stream"));
    audioEl.onplaying = ()=>{ clearTimeout(fallbackTimer); res(); };
    audioEl.src = STREAM_URL + (STREAM_URL.includes("?")?"&":"?") + "t=" + Date.now();
    fallbackTimer = setTimeout(()=>rej(new Error("timeout")), STREAM_TIMEOUT);
    audioEl.play().catch(e=>{ if (!(e && e.name==="NotAllowedError")) rej(e); });
    setNowPlaying("In diretta", "Kansei Radio");
    if (NOWPLAYING_URL){ pollNP(); npTimer = setInterval(pollNP, 15000); }
  });
}
async function pollNP(){
  try{ const r = await fetch(NOWPLAYING_URL, {cache:"no-store"}); const d = await r.json(); const s=(d.now_playing||{}).song||{};
    if (mode==="stream") setNowPlaying(s.title||"In diretta", s.artist||"Kansei Radio"); }catch(e){}
}
function stopStream(){ clearTimeout(fallbackTimer); clearInterval(npTimer); if(audioEl){ audioEl.pause(); audioEl.removeAttribute("src"); audioEl.load(); } }

/* ---------- UI ---------- */
function setNowPlaying(t,a){
  $("npTitle").textContent=t; $("npArtist").textContent=a;
  if ("mediaSession" in navigator){ try{ navigator.mediaSession.metadata = new MediaMetadata({title:t, artist:a, album:"Kansei Radio"}); }catch(e){} }
}
function showErr(m){ const e=$("err"); e.textContent=m; e.style.display="block"; clearTimeout(showErr.t); showErr.t=setTimeout(()=>e.style.display="none",4000); }
const MODE_LBL = {stream:"Live stream", sync:"In onda · sync", gen:"Demo generativa"};

async function start(){
  $("mode").textContent = "Sintonizzazione…"; $("npNext").textContent = "";
  if (STREAM_URL){ try{ mode="stream"; await startStream(); $("mode").textContent=MODE_LBL.stream; return; }catch(e){ stopStream(); } }
  try{ mode="sync"; await startSync(); $("mode").textContent=MODE_LBL.sync; return; }catch(e){ stopSync(); }
  mode="gen"; engine = makeEngine(); engine.start(); $("mode").textContent=MODE_LBL.gen;
}
function stop(){
  if (mode==="stream") stopStream(); if (mode==="sync") stopSync();
  if (engine){ engine.stop(); engine=null; }
  mode=null; setNowPlaying("In pausa","Kansei Radio"); $("npNext").textContent="";
}
async function toggle(){
  initAudio(); try{ await ctx.resume(); }catch(e){}
  playing = !playing;
  app.classList.toggle("playing", playing);
  $("onairTxt").textContent = playing ? "In onda" : "Offline";
  $("play").setAttribute("aria-label", playing ? "Metti in pausa" : "Avvia la radio");
  playing ? start() : stop();
}
$("play").addEventListener("click", toggle);
document.addEventListener("keydown", e=>{ if (e.code==="Space" && e.target.tagName!=="INPUT"){ e.preventDefault(); toggle(); } });
$("vol").addEventListener("input", e=>{ if(master) master.gain.setTargetAtTime(+e.target.value, ctx.currentTime, .05); if(audioEl && !STREAM_CORS) audioEl.volume=+e.target.value; });
if ("mediaSession" in navigator){
  try{ navigator.mediaSession.setActionHandler("play", ()=>!playing&&toggle()); navigator.mediaSession.setActionHandler("pause", ()=>playing&&toggle()); }catch(e){}
}

/* ---------- visual audio-reattivi ---------- */
const cv = $("viz"), g = cv.getContext("2d");
let W,H,DPR, freq = new Uint8Array(1024), wave = new Uint8Array(2048);
function resize(){ DPR=Math.min(2,window.devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; g.setTransform(DPR,0,0,DPR,0,0); g.fillStyle="#0B0D12"; g.fillRect(0,0,W,H); }
addEventListener("resize", resize); resize();

const parts = Array.from({length:260}, ()=>({a:Math.random()*Math.PI*2, r:Math.random(), s:.2+Math.random()*.8, z:Math.random()}));
let bassS=0, midS=0, highS=0, rot=0, t0=performance.now();
const N_BARS = 160;

function band(a,b){ let s=0; for(let i=a;i<b;i++) s+=freq[i]; return s/((b-a)*255); }

function frame(now){
  const t = (now-t0)/1000;
  if (analyser && playing){ analyser.getByteFrequencyData(freq); analyser.getByteTimeDomainData(wave); }
  else { for(let i=0;i<freq.length;i++) freq[i]*=.94; for(let i=0;i<wave.length;i++) wave[i]=128+(wave[i]-128)*.9; }
  const b=band(1,6), m=band(8,60), h=band(80,300);
  bassS += (b-bassS)*.25; midS += (m-midS)*.12; highS += (h-highS)*.12;

  const mobile = W<760;
  const cx = mobile ? W*.5 : W*.68, cy = mobile ? H*.58 : H*.48;
  const R = Math.min(W,H)*(mobile?.26:.24) * (1 + bassS*.12) * (1 + Math.sin(t*.6)*.015);

  g.fillStyle = "rgba(11,13,18,0.28)"; g.fillRect(0,0,W,H);

  // particelle
  for (const p of parts){
    p.r += (.0006 + p.s*.002) * (1 + midS*6);
    if (p.r>1){ p.r=0; p.a=Math.random()*Math.PI*2; }
    const rr = R*.9 + p.r*Math.max(W,H)*.6;
    const x = cx + Math.cos(p.a+rot*.3)*rr, y = cy + Math.sin(p.a+rot*.3)*rr;
    g.fillStyle = `rgba(236,236,236,${(1-p.r)*.35*(.4+p.z)})`;
    g.fillRect(x,y,1.2,1.2);
  }

  // barre radiali (scala logaritmica)
  rot += .0012 + midS*.004;
  g.lineCap="round";
  for (let i=0;i<N_BARS;i++){
    const k = i/N_BARS;
    const km = k<.5 ? k*2 : (1-k)*2; // spettro specchiato, simmetrico
    const idx = Math.floor(Math.pow(km,1.7)*300)+2;
    const v = freq[idx]/255;
    const idle = playing?0:(.04+.03*Math.sin(t*1.2+i*.3));
    const len = 6 + (v*v)*R*.9 + idle*R;
    const a = k*Math.PI*2 + rot - Math.PI/2;
    const x1 = cx+Math.cos(a)*R, y1 = cy+Math.sin(a)*R;
    const x2 = cx+Math.cos(a)*(R+len), y2 = cy+Math.sin(a)*(R+len);
    const hot = v>.72;
    g.strokeStyle = hot ? `rgba(227,18,27,${.55+v*.45})` : `rgba(236,236,236,${.18+v*.6})`;
    g.lineWidth = hot?2:1.2;
    g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke();
  }

  // forma d'onda circolare (rosso)
  g.beginPath();
  const step = 4, ri = R*.72;
  for (let i=0;i<=wave.length;i+=step){
    const w = (wave[i%wave.length]-128)/128;
    const a = (i/wave.length)*Math.PI*2 - rot*.6;
    const r = ri + w*R*.32;
    const x = cx+Math.cos(a)*r, y = cy+Math.sin(a)*r;
    i===0?g.moveTo(x,y):g.lineTo(x,y);
  }
  g.closePath(); g.strokeStyle = `rgba(227,18,27,${playing?.85:.35})`; g.lineWidth = 1.4; g.stroke();

  // anelli sottili
  g.strokeStyle="rgba(236,236,236,.10)"; g.lineWidth=1;
  g.beginPath(); g.arc(cx,cy,R*.98,0,Math.PI*2); g.stroke();
  g.beginPath(); g.arc(cx,cy,R*(1.55+highS*.4),0,Math.PI*2); g.stroke();
  // nucleo
  g.fillStyle = `rgba(227,18,27,${.15+bassS*.8})`;
  g.beginPath(); g.arc(cx,cy,3+bassS*10,0,Math.PI*2); g.fill();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
